<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hex Grid</title>
  <link rel="icon" type="image/webp" href="images/tidyverse.webp" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading stickers…</div>
  </div>

  <canvas id="grid"></canvas>

  <div id="panel" class="panel">
    <div class="panel-header">
      <button id="panel-close" class="panel-close" aria-label="Close">&#x2715;</button>
      <a id="panel-external" class="panel-external" target="_blank" rel="noopener" title="Open in new tab">&#x2197;</a>
    </div>
    <iframe id="panel-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
  </div>

  <div id="menu" class="menu" role="dialog" aria-label="Settings">
    <div class="menu-header">
      <h2>Settings</h2>
      <button id="menu-close" class="menu-close" aria-label="Close">&#x2715;</button>
    </div>
    <div class="menu-section">
      <label for="menu-size" class="menu-label">Hex size <span id="menu-size-value"></span></label>
      <input id="menu-size" type="range" min="40" max="250" step="5" value="100" />
    </div>
    <div class="menu-section">
      <label class="menu-check"><input id="menu-unique" type="checkbox" /> Show each sticker once</label>
    </div>
    <div class="menu-section">
      <button id="menu-share" class="menu-share" type="button">Copy share link</button>
    </div>
    <div class="menu-section menu-stickers">
      <div class="menu-label">Stickers <span id="menu-count"></span></div>
      <div class="menu-actions">
        <input id="menu-search" type="search" placeholder="Filter" autocomplete="off" />
        <button id="menu-all" type="button">All</button>
        <button id="menu-none" type="button">None</button>
      </div>
      <ul id="menu-list"></ul>
    </div>
  </div>

  <script src="packages.js"></script>
  <script src="main.js"></script>
</body>
</html>
